name: CI - Lint Check + Tests

on:
    push:
      branches:
        - "feature/**"
        - "refactor/**"
        - develop
        - main

    pull_request:
        branches:
            - develop
            - main

jobs:
  backend-quality:
    name: Backend Lint + Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Chekout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Create env file for testing
        run: |
          echo "APP_NAME=PokedexTesting" > .env
          echo "ALLOWED_ORIGINS=http://localhost:8501,http://localhost:3000" >> .env
          echo "CACHE_DB_PATH=pokemon_cache_test.db" >> .env

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Run Lint
        run: |
          ruff check .

      - name: Clean Cache and Residual Files
        run: |
          rm -f coverage
          rm -f *.db
          find . -type d -name "__pycache__" -exec rm -r {} +
          find . -type d -name ".pytest_cache" -exec rm -r {} +
          find . -type d -name ".coverage" -exec rm -r {} +

      - name: CI Testing & Coverage
        env:
          POKEAPI_BASE_URL: "https://pokeapi.co/api/v2"
          ALLOWED_ORIGINS: "http://localhost:8501,http://localhost:3000"
          CACHE_DB_PATH: "pokemon_cache.db"
          APP_NAME: "Pokedex"
          APP_VERSION: "0.1.0"
          API_PREFIX: "/api/v1"
          REQUEST_TIMEOUT: "10"
          MIN_REQUEST_DELAY: "0.1"
          CACHE_TTL: "3600"
        run: |
          mkdir -p data
          pytest --cov=app --cov-report=term-missing --cov-fail-under=90

  frontend-quality:
    name: Frontend Lint Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check formatting
        run: |
          ruff format --check .

      - name: Run Lint
        run: |
          ruff check .
